<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2415;--g1:#03361b;--g2:#0f7a2e;--g3:#4cc424;--bg:#f3f8f2;--card:#fff;--hd:rgba(255,255,255,.94);--mut:#5a6b5f;--line:#dbe6da;--warn:#b45309;box-sizing:border-box}

*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.55 Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--g3);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 20px}
header img{height:42px;width:auto}
header b{font-weight:800;letter-spacing:.2px}
header .sp{flex:1}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;background:var(--g2);color:#fff;transition:transform .15s,background .2s}
.btn:hover{background:var(--g1);transform:translateY(-1px)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}

.btn[disabled]{background:#c9d3ca;color:#5b685e;cursor:not-allowed;transform:none}
.hero{background:radial-gradient(1200px 500px at 85% -10%,#2e9e2a55,transparent),linear-gradient(135deg,var(--g1),#0a5a24);color:#fff;padding:56px 20px 64px}
.wrap{max-width:1180px;margin:0 auto}
.hgx{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}

.lg{background:#fff;border-radius:26px;padding:16px;justify-self:center;animation:rise .8s .3s both;box-shadow:0 24px 50px -20px #000a}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:50px}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}

.thumb{height:160px;background-size:cover;background-position:center;position:relative;background-color:var(--g2)}
.tag{position:absolute;top:10px;left:10px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:#fff;color:var(--g1)}
.tag.free{background:var(--g3)}
.cb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}

.row{display:flex;align-items:center;justify-content:space-between;gap:8px}

@media(max-width:760px){.hg{grid-template-columns:1fr}.lg{order:-1}.lg img{width:200px}.player{grid-template-columns:1fr}.les{max-height:200px}.hero{padding:36px 18px 48px}}

main.wrap{padding:0 20px;overflow-x:clip}
main.wide{max-width:1680px}

.ctl .btn{min-height:44px}

.fmsg[hidden],.spin[hidden],#lf[hidden]{display:none}
.li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;margin-bottom:6px;background:var(--card)}.li.dn::after{content:" ✓"}
.sb{position:relative;flex:1 1 220px}.sb input{width:100%;padding-right:40px}.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.4rem;color:var(--mut);min-width:36px;min-height:36px}
header nav input{min-width:0;width:200px}
@media(max-width:900px){.lw{grid-template-columns:minmax(0,1fr)}.les2{max-height:50vh}header nav input{width:100%}}
@media(max-height:500px) and (orientation:landscape){.lw .fw{max-height:calc(100vh - 70px);min-height:180px}}
header nav{display:flex;gap:4px}
header nav a{padding:9px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem;transition:background .2s}
header nav a:hover{background:var(--line)}header nav a.on{background:var(--g2);color:#fff}
#bMenu{display:none}
.hgx{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
.sec{padding:44px 0}.sec h2{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 6px}.sec>p{color:var(--mut);margin:0 0 22px}
.cats,.adv,.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cat,.adv>div,.steps>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .2s,border-color .2s}
.cat{cursor:pointer;text-align:left;color:var(--ink);font:inherit}.cat:hover{transform:translateY(-3px);border-color:var(--g3)}
.cat b{display:block;font-size:1.05rem}.cat span{color:var(--mut);font-size:.85rem}
.steps>div b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g2);color:#fff;margin-bottom:8px}
.faq{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:10px}.faq summary{font-weight:600;cursor:pointer}.faq p{margin:8px 0 0;color:var(--mut)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.fd{animation:fade .35s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#03361bcc);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover .thumb::after{opacity:1}
.thumb{background:linear-gradient(135deg,var(--g2),var(--g3))}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g3);transition:width .4s}
.bk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;margin:20px 0 8px;min-height:44px}
.bk:hover{border-color:var(--g3)}
.crumb{font-size:.85rem;color:var(--mut);margin-bottom:10px}.crumb a{color:var(--g2)}
.banner{height:260px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--g2),var(--g3))}.banner img{width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 320px;gap:24px;margin:20px 0}
.side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start;position:sticky;top:76px}
.fw{position:relative;aspect-ratio:16/10;background:#0b2415;border-radius:12px;overflow:hidden}.fw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.spin{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px;border:3px solid #fff4;border-top-color:var(--g3);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.les button.dn::after{content:" ✓"}
.sel{border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--card);color:var(--ink);font:inherit}
.pvbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pvbar .btn.on{background:var(--g1);color:#fff}
.pvw{background:#0b2415;border-radius:14px;padding:14px;overflow:auto;display:flex;justify-content:center;max-height:70vh}
.pvw iframe{border:0;background:#fff;height:62vh;max-width:100%;transition:width .3s}
.pvw.m iframe{border:10px solid #111;border-radius:30px}
@media(max-width:760px){header{padding:8px 12px;gap:6px}header b{font-size:.82rem}header .btn{padding:8px 12px;font-size:.8rem}#bMenu{display:inline-block}header nav{position:absolute;top:100%;left:0;right:0;background:var(--card);flex-direction:column;padding:10px;border-bottom:1px solid var(--line);display:none}header nav.on{display:flex;animation:fade .2s}.hgx{grid-template-columns:1fr}.two{grid-template-columns:1fr}.side{position:static}.banner{height:170px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt=""><b>AFRICA E-SCHOOL</b>
  <nav id="nav" aria-label="Navigation principale"><a href="#/" data-n="home">Accueil</a><a href="#/catalogue" data-n="cat">Formations</a><a href="#/faq" data-n="faq">FAQ</a><input id="hq" type="search" class="sel" placeholder="Rechercher une formation" aria-label="Rechercher une formation"></nav>
  <span class="sp"></span>
  <button class="btn alt" id="bMenu" data-menu aria-label="Menu">☰</button>
  <button class="btn alt" id="bAdmin">Administration</button>
</header>
<main id="app" class="wrap"></main>
<footer><p style="margin:0 0 6px"><b>AFRICA E-SCHOOL</b> — Apprendre • Créer • Réussir</p><p style="margin:0"><a href="#/" style="color:#bfe0bd">Accueil</a> · <a href="#/catalogue" style="color:#bfe0bd">Formations</a> · <a href="#/faq" style="color:#bfe0bd">FAQ</a></p></footer>
<div class="ov" id="ovFree"><div class="box" id="boxFree" style="max-width:440px"></div></div>
<div class="ov" id="ovAdmin"><div class="box" id="boxAdmin"></div></div>
<div class="ov" id="ovPrev"><div class="box"><button class="x" data-close="ovPrev" aria-label="Fermer">×</button><h2 style="margin:0 0 10px">Prévisualisation</h2>
<div class="pvbar"><button class="btn alt on" data-pv="d">Ordinateur</button><button class="btn alt" data-pv="t">Tablette</button><button class="btn alt" data-pv="m">Téléphone</button><button class="btn alt" data-pv="r">Réinitialiser l’affichage</button></div>
<div class="pvw" id="pvw"><iframe id="pvf" title="Aperçu du site"></iframe></div></div></div>
<script>
/* ===== CONFIGURATION ===== */
const CONFIG = {
  adminPin: 'CHANGER-CE-CODE',   // Code de l’administration (vérifié dans le navigateur uniquement)
  checkoutEndpoint: '',          // Serveur de paiement (plus tard, quand des formations seront payantes)
  accessEndpoint: ''             // Serveur qui confirme les droits d’accès après paiement
};

/* ===== DONNÉES INITIALES (liens fournis par vous ; toutes gratuites pour le moment) ===== */
const D = (id, title, cat, url, note) => ({id, title, cat, url, note: note || '', desc: 'Description à compléter dans l’administration.', price: '', currency: 'USD', status: 'free', img: 'images/f' + id + '.svg', lessons: [], obj: '', pub: 'published'});
const F = 'https://drive.google.com/drive/folders/';
const DEFAULTS = [
  D(1,'Bonus — Le hack pour avoir Gemini Premium, sans payer','Intelligence artificielle','https://drive.google.com/file/d/1m7aReSwbLtsGolcyQaP86fpSAV-dntlV/view'),
  D(2,'Créer une application web no-code avec Bubble','Informatique',F+'1d0TUUwhyknaQ0iCKX1DDLz38e6_EsLNp'),
  D(3,'Créer des images avec l’IA Midjourney','Design',F+'1140WM9l7dIMDh61nb0ooTS6JfwdlVbtG'),
  D(4,'Blender — Débuter en modélisation 3D : cours complet','Design',F+'11Qm2U9xoNUnHaqMGrhZIYez9ROCjntwn'),
  D(5,'Création de packshot produit 3D avec Blender','Design',F+'1_vFj6t11mwaYmshuOHch7VCQ2nZ_xqkE'),
  D(6,'Bonus — Logiciel de modélisation Blender','Design','','Lien à corriger : l’identifiant fourni semble tronqué (32 caractères).'),
  D(7,'Stratégie marketing — Cours ultime','Marketing',F+'1WySgBZhqoKZofR4wWncjbOsE1M2EP3tM'),
  D(8,'Maîtriser la publicité sur les réseaux sociaux','Marketing',F+'1nosV8St4nH4FjGAxJS9c5uH_fxzpWhoA'),
  D(9,'Démarrer un business dans l’affiliation','Business',F+'1wykRLnb0JS6b84WDhLJXcDjQdGvrkpla'),
  D(10,'ChatGPT de A à Z — Formation ultime pour maîtriser ChatGPT','Intelligence artificielle',F+'1AlQyZTRUvjg8Fpl_am5078mqpWBS6ZLa'),
  D(11,'Vivre de ses livres numériques grâce à ChatGPT','Business',F+'1uz0fZW1a3q8PQNWo_YNAAjLIV6VvdIAU'),
  D(12,'Combiner ChatGPT et Excel pour optimiser son temps de travail','Intelligence artificielle','','Lien à corriger : l’identifiant fourni contient une espace.'),
  D(13,'ChatGPT — Automatiser vos Facebook Ads avec simplicité','Marketing',F+'14Ep_UnKVesXfuTT67sPDYP21jEkfllWt'),
  D(14,'Stratégie pour percer sur TikTok, Instagram et YouTube Shorts','Marketing',F+'1HclMaGTQgYq3Rf6Ynr7fDEuL5-mhd11P'),
  D(15,'Freelance — Débuter efficacement sur ComeUp','Business',F+'1_YYBFizCdezmT4e5uNQzntoEJzj-DBIR')
];

/* ===== STOCKAGE LOCAL (démo) ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let courses = store.get('aes_courses_v2', null) || JSON.parse(JSON.stringify(DEFAULTS));
let ent = store.get('aes_ent', []);
let ratings = store.get('aes_ratings', {});
let user = store.get('aes_user', null);
let cat = 'Toutes', term = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => store.set('aes_courses_v2', courses);
const imgSrc = p => (window.IMGS && window.IMGS[p]) || p;

/* ===== LIENS GOOGLE DRIVE ===== */
function parseDrive(u){
  u = (u || '').trim();
  if(!u) return {err:'Aucun lien renseigné'};
  if(/\s/.test(u)) return {err:'Le lien contient une espace'};
  const m = u.match(/drive\.google\.com\/(file\/d|drive\/folders)\/([\w-]+)/);
  if(!m) return {err:'Lien Google Drive non reconnu'};
  return {type: m[1] === 'file/d' ? 'file' : 'folder', id: m[2]};
}
function embedSrc(u){
  const p = parseDrive(u); if(p.err) return null;
  return p.type === 'file' ? 'https://drive.google.com/file/d/' + p.id + '/preview'
                           : 'https://drive.google.com/embeddedfolderview?id=' + p.id + '#list';
}

/* ===== ACCÈS ===== */
const isFree = c => c.status === 'free';
const hasAccess = c => isFree(c) ? !!user : ent.includes(c.id); // paiement : à vérifier côté serveur en production
const avg = id => { const r = ratings[id] || []; return r.length ? r.reduce((a,b)=>a+b,0)/r.length : 0; };
const starTxt = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));

/* ===== OUTILS V3 ===== */
const PV = new URLSearchParams(location.search).has('preview');
const log = m => { const l = store.get('aes_log', []); l.push(new Date().toISOString().slice(0,16) + ' ' + m); store.set('aes_log', l.slice(-50)); };
let prog = store.get('aes_prog', {});
const live = () => courses.filter(c => c.pub !== 'draft' && c.pub !== 'archived');
const pct = c => { const ids = lessonsOf(c).map(l => l.id), d = (prog[c.id] && prog[c.id].done || []).filter(x => ids.includes(x)); return Math.round(d.length / ids.length * 100); };
const lessonsOf = c => c.lessons.length ? c.lessons : [{id:'main', t:'Contenu de la formation', url:c.url}];
const lid = () => 'l' + Math.random().toString(36).slice(2,9);
let fprice = 'all', sort = 'def', cur = null;

/* ===== NAVIGATION ET RETOUR ===== */
let hist = [location.hash || '#/'];
const go = h => { location.hash = h; };
const FALL = h => /^#\/learn\//.test(h) ? '#/course/' + h.split('/')[2] : /^#\/course\//.test(h) ? '#/catalogue' : '#/';
const back = () => hist.length > 1 ? history.back() : go(FALL(location.hash || '#/'));
addEventListener('hashchange', () => { const h = location.hash || '#/'; if(hist.length > 1 && hist[hist.length-2] === h) hist.pop(); else if(hist[hist.length-1] !== h) hist.push(h); route(); });

/* ===== PAGES ===== */
const img = c => c.img ? `<img src="${esc(imgSrc(c.img))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : '';
const bk = '<button class="bk" data-back>← Retour</button>';
function card(c){
  const bad = parseDrive(c.url).err, r = (ratings[c.id]||[]).length, p = pct(c);
  const price = isFree(c) ? '<span class="price">Gratuit</span>' : (c.price ? `<span class="price">${esc(c.price)} ${esc(c.currency)}</span>` : '<span class="warn">Prix à définir</span>');

  else if('menu' in d) $('#nav').classList.toggle('on');
  else if(d.scroll) $('#' + d.scroll).scrollIntoView({behavior:'smooth'});
  else if(d.cat){ cat = d.cat; if((location.hash||'#/') === '#/catalogue') route(); else go('#/catalogue'); }
  else if(d.lid){ loadLesson(lessonsOf(cur).findIndex(l => l.id === d.lid)); if(innerWidth <= 900) $('#les2').classList.add('hide'); }
  else if(d.step){ if(!t.disabled){ if('done' in d) markDone(); loadLesson(curIdx() + +d.step); } }
  else if('fin' in d) markDone();
  else if('cin' in d){ const w = $('#lw'); w.classList.toggle('cin'); t.textContent = w.classList.contains('cin') ? 'Disposition normale' : 'Mode cinéma'; }
  else if('ltg' in d) $('#les2').classList.toggle('hide');
  else if('fs' in d){ const el = $('#fw'); if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen().catch(() => {}); }
  else if('clr' in d){ term = ''; route(); }
  else if(d.free){ const c = courses.find(x => x.id === +d.free); if(user) go('#/learn/' + c.id); else openFree(c.id); }
  else if(d.close) $('#' + d.close).classList.remove('on');
  else if(d.pv){ pvSet(d.pv); }
  else if('pvopen' in d){ $('#ovPrev').classList.add('on'); pvSet('d'); }
  else if(d.r){ const a = ratings[cur.id] || (ratings[cur.id] = []); a.push(+d.r); store.set('aes_ratings', ratings); t.parentNode.querySelectorAll('span').forEach(s => s.classList.toggle('on', +s.dataset.r <= +d.r)); }
  else if(d.a) adminAct(t);
  else if(t.id === 'bAdmin') openAdmin();
  else if(t.id === 'fGo'){
    const n = $('#fName').value.trim(), m = $('#fMail').value.trim();
    if(!n || !/^\S+@\S+\.\S+$/.test(m)){ $('#fErr').textContent = 'Saisissez votre nom et une adresse e-mail valide.'; return; }
    if(!$('#fOk').checked){ $('#fErr').textContent = 'Acceptez les conditions pour continuer.'; return; }
    user = {name:n, mail:m}; store.set('aes_user', user);
    $('#ovFree').classList.remove('on'); go('#/learn/' + d.id);
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'hq'){ term = e.target.value.toLowerCase().trim(); if((location.hash||'#/') !== '#/catalogue') go('#/catalogue'); else route(); }
  else if(e.target.id === 'q'){ term = e.target.value.toLowerCase(); const pos = e.target.selectionStart; route(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('change', e => { if(e.target.id === 'fp'){ fprice = e.target.value; route(); } if(e.target.id === 'so'){ sort = e.target.value; route(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.ov.on').forEach(o => o.classList.remove('on')); });
if(PV){ const b = $('#bAdmin'); if(b) b.remove(); }
ensure(); route(); syncAccess();
</script>
</body>
